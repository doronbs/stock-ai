# A/B test of method variants across many stocks (blind walk). Trigger: push to `run-ab`.
name: A/B method test
on:
  workflow_dispatch:
  push:
    branches: [run-ab]
permissions:
  contents: write
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [V0, V1, V2, V3, V4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-server.txt}
      - run: pip install -r requirements-server.txt
      - name: Run variant
        env: {STOCKAI_MIN_CACHE: "7200", PYTHONUNBUFFERED: "1"}
        run: |
          TICKERS=$(python -c "import json;print(json.load(open('ab-request.json'))['tickers'])" 2>/dev/null || echo "NVDA,AAPL,MSFT,AMZN,META,TSLA,JPM,XOM,AMD,COST")
          DAYS=$(python -c "import json;print(json.load(open('ab-request.json'))['days'])" 2>/dev/null || echo 60)
          python -m engine.abtest --variant ${{ matrix.variant }} --tickers "$TICKERS" --days "$DAYS" --out /tmp/ab
      - name: Publish
        if: always()
        run: |
          git config user.name "stockai-bot"; git config user.email "actions@users.noreply.github.com"
          B=ab-results-${{ matrix.variant }}
          git checkout --orphan $B; git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p reports && cp /tmp/ab/* reports/ 2>/dev/null || true
          git add reports && git commit -qm "A/B ${{ matrix.variant }}" && git push -f origin $B
