services:
  - type: web
    name: stockai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_PASSWORD
        sync: false
